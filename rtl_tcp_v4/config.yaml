name: RTL-TCP (RTL-SDR Blog driver)
version: "1.0.0"
slug: rtl_tcp_v4
description: >-
  rtl_tcp server built from the RTL-SDR Blog driver, so RTL-SDR Blog V3 and V4
  dongles actually tune. Point rtlamr2mqtt, rtl_433 or any SDR client at it.
url: https://github.com/BrawnyBravo/ha-addons/tree/main/rtl_tcp_v4
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: services
boot: auto
usb: true
udev: true
host_network: false
ports:
  1234/tcp: 1234
ports_description:
  1234/tcp: rtl_tcp server (raw IQ stream)
options:
  device_index: 0
  bind_address: 0.0.0.0
  sample_rate: 2048000
  frequency: 912600000
  gain: 0
  ppm_error: 0
  max_buffers: 500
schema:
  device_index: int(0,8)
  bind_address: str
  sample_rate: int(225001,3200000)
  frequency: int(24000000,1766000000)
  gain: float(0,50)
  ppm_error: int(-200,200)
  max_buffers: int(1,2000)
